<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세계사 & 지성사 아카이브 — 역사가 낳은 위대한 책들</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Serif KR (고전적 아카이브 감성) & Inter / Pretendard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'Inter', 'sans-serif'],
                        serif: ['"Noto Serif KR"', 'Georgia', 'serif'],
                    },
                    colors: {
                        archive: {
                            paper: '#FAF8F5',
                            card: '#FFFFFF',
                            ink: '#1E242B',
                            muted: '#5C6672',
                            gold: '#B4833E',
                            goldLight: '#F4ECE1',
                            navy: '#1B2A4A',
                            border: '#E5DFD5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 커스텀 스크롤바 및 미세 스타일 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.65);
        }
        .serif-title {
            font-family: 'Noto Serif KR', Georgia, serif;
        }
        /* 타임라인 연결선 */
        .timeline-line::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 1.15rem;
            width: 2px;
            background: linear-gradient(to bottom, #D6CEC2 0%, #B4833E 50%, #D6CEC2 100%);
            opacity: 0.5;
        }
        .dark .timeline-line::before {
            background: linear-gradient(to bottom, #334155 0%, #D97706 50%, #334155 100%);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-archive-paper text-archive-ink dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen flex flex-col">

    <!-- 상단 헤더 바 -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-archive-border dark:border-slate-800 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
            <!-- 브랜드 로고 -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-archive-navy dark:bg-amber-600 text-white flex items-center justify-center shadow-md shrink-0">
                    <i data-lucide="book-open-check" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="serif-title text-lg sm:text-xl font-bold tracking-tight text-archive-navy dark:text-amber-400">
                            세계사 & 지성사 아카이브
                        </h1>
                        <span class="hidden md:inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-archive-goldLight text-archive-gold dark:bg-amber-950/60 dark:text-amber-300 border border-archive-gold/20">
                            Chronicle & Canon
                        </span>
                    </div>
                    <p class="text-xs text-archive-muted dark:text-slate-400 hidden sm:block">
                        역사적 격변이 낳은 불멸의 고전과 사상가들의 연대기
                    </p>
                </div>
            </div>

            <!-- 중앙 뷰 전환 탭 -->
            <div class="flex items-center bg-stone-100 dark:bg-slate-800 p-1 rounded-xl border border-archive-border dark:border-slate-700">
                <button id="tab-events" onclick="switchView('events')" class="flex items-center gap-1.5 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white dark:bg-slate-700 text-archive-navy dark:text-amber-300 shadow-sm">
                    <i data-lucide="landmark" class="w-4 h-4"></i>
                    <span>사건 → 저서 탐색</span>
                    <span id="badge-event-count" class="ml-1 px-1.5 py-0.2 text-[11px] rounded-full bg-archive-goldLight dark:bg-slate-600 text-archive-gold dark:text-amber-300">0</span>
                </button>
                <button id="tab-books" onclick="switchView('books')" class="flex items-center gap-1.5 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-archive-muted dark:text-slate-400 hover:text-archive-ink dark:hover:text-white">
                    <i data-lucide="library" class="w-4 h-4"></i>
                    <span>고전/저자 도서관</span>
                    <span id="badge-book-count" class="ml-1 px-1.5 py-0.2 text-[11px] rounded-full bg-stone-200 dark:bg-slate-700 text-stone-600 dark:text-slate-300">0</span>
                </button>
            </div>

            <!-- 우측 유틸리티 버튼 -->
            <div class="flex items-center gap-2">
                <button onclick="openAddModal()" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-archive-navy hover:bg-slate-800 dark:bg-amber-600 dark:hover:bg-amber-500 text-white text-xs sm:text-sm font-medium transition-all shadow-sm">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">사건·저서 추가</span>
                    <span class="sm:hidden">추가</span>
                </button>
                <button onclick="toggleDarkMode()" title="다크/라이트 모드 전환" class="p-2 rounded-xl border border-archive-border dark:border-slate-700 bg-white dark:bg-slate-800 text-archive-muted dark:text-slate-300 hover:bg-stone-100 dark:hover:bg-slate-700 transition-colors">
                    <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- 검색 및 필터 컨트롤 바 -->
        <div class="bg-stone-50/80 dark:bg-slate-900/60 border-t border-archive-border/70 dark:border-slate-800/80">
            <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-2.5 flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-2.5">
                <!-- 검색 입력창 -->
                <div class="relative flex-1 max-w-xl">
                    <i data-lucide="search" class="w-4 h-4 text-archive-muted dark:text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="search-input" oninput="handleSearch()" placeholder="사건명, 연도(예: 1789), 책 제목, 저자명, 키워드 검색..." 
                        class="w-full pl-10 pr-9 py-2 rounded-xl bg-white dark:bg-slate-800 border border-archive-border dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-archive-gold dark:focus:ring-amber-500 transition-all placeholder:text-stone-400">
                    <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600 dark:hover:text-slate-200">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- 시대 필터 칩 & 분야 필터 -->
                <div class="flex flex-wrap items-center gap-2">
                    <div id="era-filters" class="flex items-center gap-1 overflow-x-auto pb-1 sm:pb-0">
                        <button onclick="setEraFilter('ALL')" data-era="ALL" class="era-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-archive-gold text-white shadow-sm transition-all whitespace-nowrap">전체 시대</button>
                        <button onclick="setEraFilter('고대')" data-era="고대" class="era-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-archive-muted dark:text-slate-300 border border-archive-border dark:border-slate-700 hover:border-archive-gold transition-all whitespace-nowrap">고대 (~476)</button>
                        <button onclick="setEraFilter('중세')" data-era="중세" class="era-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-archive-muted dark:text-slate-300 border border-archive-border dark:border-slate-700 hover:border-archive-gold transition-all whitespace-nowrap">중세 (477~1491)</button>
                        <button onclick="setEraFilter('근대 여명')" data-era="근대 여명" class="era-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-archive-muted dark:text-slate-300 border border-archive-border dark:border-slate-700 hover:border-archive-gold transition-all whitespace-nowrap">근대 여명 (1492~1788)</button>
                        <button onclick="setEraFilter('혁명과 제국주의')" data-era="혁명과 제국주의" class="era-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-archive-muted dark:text-slate-300 border border-archive-border dark:border-slate-700 hover:border-archive-gold transition-all whitespace-nowrap">혁명·제국주의 (1789~1913)</button>
                        <button onclick="setEraFilter('현대')" data-era="현대" class="era-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-archive-muted dark:text-slate-300 border border-archive-border dark:border-slate-700 hover:border-archive-gold transition-all whitespace-nowrap">현대 (1914~현재)</button>
                    </div>

                    <select id="field-filter" onchange="handleFieldFilter()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-archive-ink dark:text-slate-200 border border-archive-border dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-archive-gold">
                        <option value="ALL">모든 학문 분야</option>
                        <option value="철학">철학·윤리학</option>
                        <option value="정치·사회">정치·사회·법학</option>
                        <option value="역사·인류">역사·인류·지리</option>
                        <option value="과학·의학">과학·수학·의학</option>
                        <option value="경제학">경제학</option>
                        <option value="문학·비평">문학·문화비평</option>
                        <option value="심리·언어">심리·언어·종교</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-5">
        
        <!-- 뷰 1: 세계사 사건 -> 연관 저서 마스터-디테일 뷰 -->
        <div id="view-events" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- 좌측 컬럼: 세계사 주요 사건 타임라인 리스트 (5칸) -->
            <section class="lg:col-span-5 bg-white dark:bg-slate-900 rounded-2xl border border-archive-border dark:border-slate-800 shadow-sm overflow-hidden flex flex-col lg:h-[calc(100vh-165px)] lg:sticky lg:top-[145px]">
                <div class="px-4 py-3 bg-stone-50 dark:bg-slate-800/70 border-b border-archive-border dark:border-slate-800 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i data-lucide="scroll-text" class="w-4 h-4 text-archive-gold dark:text-amber-400"></i>
                        <h2 class="text-sm font-bold text-archive-navy dark:text-slate-100">세계사 주요 사건 연표</h2>
                    </div>
                    <span id="filtered-event-status" class="text-xs text-archive-muted dark:text-slate-400 font-medium">총 0건</span>
                </div>

                <!-- 사건 리스트 컨테이너 -->
                <div id="event-list-container" class="flex-1 overflow-y-auto p-3 space-y-2 relative timeline-line">
                    <!-- JS로 동적 렌더링 -->
                </div>
            </section>

            <!-- 우측 컬럼: 선택된 사건 상세 및 연관 저서 패널 (7칸) -->
            <section id="desktop-detail-panel" class="hidden lg:block lg:col-span-7 bg-white dark:bg-slate-900 rounded-2xl border border-archive-border dark:border-slate-800 shadow-sm overflow-hidden min-h-[calc(100vh-165px)]">
                <div id="detail-content-desktop" class="p-6 sm:p-8">
                    <!-- JS로 동적 렌더링 -->
                </div>
            </section>
        </div>

        <!-- 뷰 2: 고전/저자 도서관 역방향 탐색 뷰 -->
        <div id="view-books" class="hidden animate-fade-in">
            <div class="mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-archive-border dark:border-slate-800 shadow-sm">
                <div>
                    <h2 class="serif-title text-lg font-bold text-archive-navy dark:text-amber-400 flex items-center gap-2">
                        <i data-lucide="book-marked" class="w-5 h-5 text-archive-gold"></i>
                        인류 지성사 고전 & 저자 도서관
                    </h2>
                    <p class="text-xs sm:text-sm text-archive-muted dark:text-slate-400 mt-0.5">
                        각 고전과 저자를 클릭하면, 이 책이 탄생하는 데 결정적 배경이 된 역사적 사건으로 바로 이동하여 맥락을 확인할 수 있습니다.
                    </p>
                </div>
                <div class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-archive-goldLight dark:bg-amber-950/50 text-archive-gold dark:text-amber-300 self-start sm:self-center">
                    검색된 명저: <span id="filtered-book-status">0</span>권
                </div>
            </div>

            <div id="books-grid-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                <!-- JS로 동적 렌더링 -->
            </div>
        </div>

    </main>

    <!-- 모바일 전용 상세 보기 드로어/모달 -->
    <div id="mobile-detail-modal" class="fixed inset-0 z-50 hidden lg:hidden bg-black/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-2xl max-h-[90vh] rounded-t-3xl sm:rounded-2xl border border-archive-border dark:border-slate-700 shadow-2xl flex flex-col overflow-hidden animate-fade-in">
            <div class="px-5 py-3.5 bg-stone-50 dark:bg-slate-800 border-b border-archive-border dark:border-slate-700 flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-archive-gold dark:text-amber-400">사건 & 연관 고전 상세 분석</span>
                <button onclick="closeMobileModal()" class="p-1.5 rounded-lg bg-stone-200/70 dark:bg-slate-700 text-stone-600 dark:text-slate-300 hover:bg-stone-300">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="detail-content-mobile" class="p-5 overflow-y-auto flex-1">
                <!-- JS로 동적 렌더링 -->
            </div>
        </div>
    </div>

    <!-- 사용자 정의 사건/연관 저서 추가 모달 -->
    <div id="add-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 w-full max-w-xl max-h-[90vh] rounded-2xl border border-archive-border dark:border-slate-700 shadow-2xl flex flex-col overflow-hidden animate-fade-in">
            <div class="px-6 py-4 bg-archive-navy dark:bg-slate-800 text-white flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="feather" class="w-5 h-5 text-amber-400"></i>
                    <h3 class="serif-title text-base font-bold">새로운 역사적 사건 및 연관 저서 등록</h3>
                </div>
                <button onclick="closeAddModal()" class="p-1 rounded-lg hover:bg-white/10 text-slate-300 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="add-entry-form" onsubmit="handleAddSubmit(event)" class="p-6 overflow-y-auto space-y-4 text-sm">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">시대 구분 *</label>
                        <select id="new-era" required class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800">
                            <option value="고대">고대 (~476년)</option>
                            <option value="중세">중세 (477~1491년)</option>
                            <option value="근대 여명">근대 여명 (1492~1788년)</option>
                            <option value="혁명과 제국주의">혁명과 제국주의 (1789~1913년)</option>
                            <option value="현대" selected>현대 (1914년~현재)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">발생 연도 *</label>
                        <input type="text" id="new-year" required placeholder="예: 1968년 또는 기원전 44년" class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">역사적 사건명 *</label>
                    <input type="text" id="new-event-title" required placeholder="예: 프랑스 68혁명" class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">사건 개요 및 역사적 의의 *</label>
                    <textarea id="new-event-desc" required rows="2" placeholder="사건의 배경과 인류사에 미친 영향을 간략히 입력하세요." class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800"></textarea>
                </div>

                <hr class="border-archive-border dark:border-slate-800">
                <p class="text-xs font-bold text-archive-gold dark:text-amber-400 uppercase tracking-wider">이 사건의 영향을 받은 대표 저서 정보</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">책 제목 *</label>
                        <input type="text" id="new-book-title" required placeholder="예: 감시와 처벌" class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">학문 분야 *</label>
                        <select id="new-book-field" required class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800">
                            <option value="철학">철학</option>
                            <option value="정치·사회">정치·사회</option>
                            <option value="역사·인류">역사·인류</option>
                            <option value="과학·의학">과학·의학</option>
                            <option value="경제학">경제학</option>
                            <option value="문학·비평">문학·비평</option>
                            <option value="심리·언어">심리·언어</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">저자 이름 *</label>
                        <input type="text" id="new-author-name" required placeholder="예: 미셸 푸코" class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">출생연도 *</label>
                        <input type="text" id="new-author-birth" required placeholder="예: 1926년" class="w-full px-3 py-2 rounded-xl border border-archive-border dark:border-slate-700 bg-stone-50 dark:bg-slate-800">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-archive-muted dark:text-slate-400 mb-1">사망연도 *</label>

                        summary: "디지털 초연결 시대 현대인이 외부의 억압이 아닌 스스로를 착취하는 '성과주체'가 되어 우울증과 번아웃에 시달리는 신자유주의 정신병리를 진단한 철학 에세이입니다."
                    }
                ]
            }
        ];

        // ============================================================================
        // 상태 관리 및 로컬 스토리지 연동
        // ============================================================================
        const STORAGE_KEY = 'world_history_books_archive_v1';
        let archiveData = [];
        let selectedEventId = null;
        let currentView = 'events'; // 'events' or 'books'
        let currentEraFilter = 'ALL';
        let currentFieldFilter = 'ALL';
        let searchQuery = '';

        // 초기화
        function initApp() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    archiveData = JSON.parse(saved);
                } catch (e) {
                    archiveData = [...INITIAL_HISTORY_DATA];
                }
            } else {
                archiveData = [...INITIAL_HISTORY_DATA];
            }

            // 다크모드 초기화
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').setAttribute('data-lucide', 'sun');
            }

            // 첫 번째 사건 기본 선택
            if (archiveData.length > 0) {
                selectedEventId = archiveData[0].id;
            }

            updateCounters();
            renderAll();
            lucide.createIcons();
        }

        function saveToStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(archiveData));
            updateCounters();
        }

        function updateCounters() {
            const totalEvents = archiveData.length;
            const totalBooks = archiveData.reduce((acc, ev) => acc + (ev.books ? ev.books.length : 0), 0);
            document.getElementById('badge-event-count').textContent = totalEvents;
            document.getElementById('badge-book-count').textContent = totalBooks;
        }

        // 다크/라이트 모드 토글
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                icon.setAttribute('data-lucide', 'moon');
            } else {
                html.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                icon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        }

        // 뷰 전환 ('events' vs 'books')
        function switchView(viewName) {
            currentView = viewName;
            const tabEvents = document.getElementById('tab-events');
            const tabBooks = document.getElementById('tab-books');
            const viewEvents = document.getElementById('view-events');
            const viewBooks = document.getElementById('view-books');

            if (viewName === 'events') {
                tabEvents.className = "flex items-center gap-1.5 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white dark:bg-slate-700 text-archive-navy dark:text-amber-300 shadow-sm";
                tabBooks.className = "flex items-center gap-1.5 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-archive-muted dark:text-slate-400 hover:text-archive-ink dark:hover:text-white";
                viewEvents.classList.remove('hidden');
                viewBooks.classList.add('hidden');
            } else {
                tabBooks.className = "flex items-center gap-1.5 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition-all bg-white dark:bg-slate-700 text-archive-navy dark:text-amber-300 shadow-sm";
                tabEvents.className = "flex items-center gap-1.5 px-3 sm:px-4 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all text-archive-muted dark:text-slate-400 hover:text-archive-ink dark:hover:text-white";
                viewBooks.classList.remove('hidden');
                viewEvents.classList.add('hidden');
            }
            renderAll();
        }

        // 필터링 로직
        function getFilteredEvents() {
            const q = searchQuery.trim().toLowerCase();
            return archiveData.filter(ev => {
                // 시대 필터
                if (currentEraFilter !== 'ALL' && ev.era !== currentEraFilter) return false;

                // 분야 필터 (해당 사건의 연관 도서 중 하나라도 선택된 분야를 가지면 포함)
                if (currentFieldFilter !== 'ALL') {
                    const hasField = ev.books.some(b => b.field === currentFieldFilter);
                    if (!hasField) return false;
                }

                // 검색어 필터
                if (q) {
                    const inEvent = ev.title.toLowerCase().includes(q) ||
                                    ev.year.toLowerCase().includes(q) ||
                                    ev.significance.toLowerCase().includes(q);
                    const inBooks = ev.books.some(b =>
                        b.title.toLowerCase().includes(q) ||
                        b.author.toLowerCase().includes(q) ||
                        b.summary.toLowerCase().includes(q) ||
                        b.field.toLowerCase().includes(q)
                    );
                    if (!inEvent && !inBooks) return false;
                }

                return true;
            });
        }

        function setEraFilter(era) {
            currentEraFilter = era;
            document.querySelectorAll('.era-btn').forEach(btn => {
                if (btn.getAttribute('data-era') === era) {
                    btn.className = "era-btn active px-3 py-1.5 rounded-lg text-xs font-semibold bg-archive-gold text-white shadow-sm transition-all whitespace-nowrap";
                } else {
                    btn.className = "era-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-white dark:bg-slate-800 text-archive-muted dark:text-slate-300 border border-archive-border dark:border-slate-700 hover:border-archive-gold transition-all whitespace-nowrap";
                }
            });
            renderAll();
        }

        function handleFieldFilter() {
            currentFieldFilter = document.getElementById('field-filter').value;
            renderAll();
        }

        function handleSearch() {
            const input = document.getElementById('search-input');
            searchQuery = input.value;
            const clearBtn = document.getElementById('clear-search-btn');
            if (searchQuery.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            renderAll();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            document.getElementById('clear-search-btn').classList.add('hidden');
            renderAll();
        }

        // 분야별 뱃지 색상 반환
        function getFieldBadgeStyle(field) {
            const map = {
                '철학': 'bg-indigo-50 text-indigo-700 border-indigo-200 dark:bg-indigo-950/60 dark:text-indigo-300 dark:border-indigo-800',
                '정치·사회': 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/60 dark:text-rose-300 dark:border-rose-800',
                '역사·인류': 'bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/60 dark:text-amber-300 dark:border-amber-800',
                '과학·의학': 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/60 dark:text-emerald-300 dark:border-emerald-800',
                '경제학': 'bg-cyan-50 text-cyan-800 border-cyan-200 dark:bg-cyan-950/60 dark:text-cyan-300 dark:border-cyan-800',
                '문학·비평': 'bg-purple-50 text-purple-700 border-purple-200 dark:bg-purple-950/60 dark:text-purple-300 dark:border-purple-800',
                '심리·언어': 'bg-orange-50 text-orange-800 border-orange-200 dark:bg-orange-950/60 dark:text-orange-300 dark:border-orange-800'
            };
            return map[field] || 'bg-stone-100 text-stone-700 border-stone-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700';
        }

        // 전체 렌더링 조율
        function renderAll() {
            const filteredEvents = getFilteredEvents();
            renderEventList(filteredEvents);

            // 현재 선택된 사건이 필터 결과에 없으면 첫 번째 항목으로 자동 보정
            if (filteredEvents.length > 0 && !filteredEvents.some(e => e.id === selectedEventId)) {
                selectedEventId = filteredEvents[0].id;
            }
            renderDetailPanel(filteredEvents.find(e => e.id === selectedEventId));
            renderBooksLibrary(filteredEvents);
            lucide.createIcons();
        }

        // 좌측 사건 타임라인 리스트 렌더링
        function renderEventList(events) {
            const container = document.getElementById('event-list-container');
            document.getElementById('filtered-event-status').textContent = `검색 결과 ${events.length}건`;

            if (events.length === 0) {
                container.innerHTML = `
                    <div class="py-12 px-4 text-center">
                        <i data-lucide="search-x" class="w-10 h-10 text-stone-300 dark:text-slate-600 mx-auto mb-2"></i>
                        <p class="text-sm font-semibold text-archive-muted dark:text-slate-400">일치하는 역사적 사건이나 저서가 없습니다.</p>
                        <button onclick="clearSearch(); setEraFilter('ALL');" class="mt-3 text-xs text-archive-gold dark:text-amber-400 underline">필터 초기화하기</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = events.map(ev => {
                const isSelected = ev.id === selectedEventId;
                const bookCount = ev.books.length;
                return `
                    <div onclick="selectEvent('${ev.id}')" 
                        class="group relative pl-8 pr-3.5 py-3 rounded-xl cursor-pointer transition-all border ${
                            isSelected 
                            ? 'bg-archive-goldLight/70 dark:bg-amber-950/40 border-archive-gold dark:border-amber-500/70 shadow-xs' 
                            : 'bg-white dark:bg-slate-900/60 border-transparent hover:bg-stone-50 dark:hover:bg-slate-800/70 hover:border-archive-border dark:hover:border-slate-700'
                        }">
                        <!-- 타임라인 점 -->
                        <span class="absolute left-[0.8rem] top-4 w-3 h-3 rounded-full border-2 transition-transform ${
                            isSelected 
                            ? 'bg-archive-gold dark:bg-amber-400 border-white dark:border-slate-900 scale-125' 
                            : 'bg-stone-300 dark:bg-slate-600 border-white dark:border-slate-900 group-hover:bg-archive-gold'
                        }"></span>

                        <div class="flex items-center justify-between gap-2 mb-1">
                            <span class="text-xs font-bold tracking-tight ${isSelected ? 'text-archive-gold dark:text-amber-400' : 'text-archive-navy dark:text-slate-300'}">
                                ${ev.year}
                            </span>
                            <div class="flex items-center gap-1.5">
                                <span class="text-[11px] px-2 py-0.5 rounded-md bg-stone-100 dark:bg-slate-800 text-archive-muted dark:text-slate-400 font-medium">
                                    ${ev.era}
                                </span>
                                <span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-md bg-archive-navy/10 dark:bg-amber-500/15 text-archive-navy dark:text-amber-300 font-semibold">
                                    <i data-lucide="book" class="w-3 h-3"></i> ${bookCount}권
                                </span>
                            </div>
                        </div>

                        <h3 class="serif-title text-sm sm:text-[15px] font-bold leading-snug ${isSelected ? 'text-archive-ink dark:text-white' : 'text-archive-ink/90 dark:text-slate-200'}">
                            ${ev.title}
                        </h3>

                        <p class="text-xs text-archive-muted dark:text-slate-400 line-clamp-1 mt-1">
                            대표 저서: ${ev.books.map(b => `《${b.title}》`).join(', ')}
                        </p>
                    </div>
                `;
            }).join('');
        }

        // 사건 클릭 핸들러
        function selectEvent(eventId) {
            selectedEventId = eventId;
            const filteredEvents = getFilteredEvents();
            renderEventList(filteredEvents);
            const targetEvent = archiveData.find(e => e.id === eventId);
            renderDetailPanel(targetEvent);
            lucide.createIcons();

            // 모바일 화면(1024px 미만)일 경우 모달 오픈
            if (window.innerWidth < 1024) {
                document.getElementById('mobile-detail-modal').classList.remove('hidden');
            }
        }

        function closeMobileModal() {
            document.getElementById('mobile-detail-modal').classList.add('hidden');
        }

        // 우측 상세 패널 및 모바일 모달 내용 렌더링
        function renderDetailPanel(ev) {
            const desktopContainer = document.getElementById('detail-content-desktop');
            const mobileContainer = document.getElementById('detail-content-mobile');

            if (!ev) {
                const emptyHTML = `
                    <div class="h-96 flex flex-col items-center justify-center text-center text-archive-muted dark:text-slate-400">
                        <i data-lucide="compass" class="w-12 h-12 mb-3 text-stone-300 dark:text-slate-600"></i>
                        <p class="text-base font-semibold">좌측 연표에서 역사적 사건을 선택해 주세요.</p>
                    </div>
                `;
                desktopContainer.innerHTML = emptyHTML;
                mobileContainer.innerHTML = emptyHTML;
                return;
            }

            // 현재 분야 필터가 적용되어 있다면 관련 책 강조 표시
            const html = `
                <div class="animate-fade-in">
                    <!-- 상단 사건 메타 뱃지 -->
                    <div class="flex flex-wrap items-center gap-2 mb-3">
                        <span class="px-3 py-1 rounded-full text-xs font-bold bg-archive-navy text-white dark:bg-amber-600 shadow-xs">
                            ${ev.year}
                        </span>
                        <span class="px-3 py-1 rounded-full text-xs font-semibold bg-archive-goldLight text-archive-gold dark:bg-slate-800 dark:text-amber-300 border border-archive-gold/20">
                            ${ev.era} 시대
                        </span>
                        <span class="px-3 py-1 rounded-full text-xs font-medium bg-stone-100 text-stone-600 dark:bg-slate-800 dark:text-slate-400">
                            연관 명저 ${ev.books.length}권
                        </span>
                    </div>

                    <!-- 사건 제목 -->
                    <h2 class="serif-title text-xl sm:text-2xl lg:text-[26px] font-bold text-archive-navy dark:text-white leading-tight mb-4">
                        ${ev.title}
                    </h2>

                    <!-- 사건 개요 및 역사적 의의 박스 -->
                    <div class="p-4 sm:p-5 rounded-2xl bg-stone-50 dark:bg-slate-800/80 border border-archive-border dark:border-slate-700/80 mb-7">
                        <div class="flex items-center gap-1.5 text-xs font-bold text-archive-gold dark:text-amber-400 uppercase tracking-wider mb-1.5">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                            <span>사건 개요 및 세계사적 의의</span>
                        </div>
                        <p class="text-sm sm:text-[15px] text-archive-ink dark:text-slate-200 leading-relaxed">
                            ${ev.significance}
                        </p>
                    </div>

                    <!-- 연관 저서 섹션 헤더 -->
                    <div class="flex items-center justify-between mb-4 pb-2 border-b border-archive-border dark:border-slate-800">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-lg bg-archive-goldLight dark:bg-amber-950/60 text-archive-gold dark:text-amber-400 flex items-center justify-center">
                                <i data-lucide="book-open" class="w-4 h-4"></i>
                            </div>
                            <h3 class="serif-title text-base sm:text-lg font-bold text-archive-navy dark:text-amber-300">
                                이 사건 이후 영향을 받아 탄생한 위대한 저서
                            </h3>
                        </div>
                    </div>

                    <!-- 연관 저서 카드 리스트 -->
                    <div class="space-y-4">
                        ${ev.books.map((book, idx) => {
                            const isHighlighted = currentFieldFilter !== 'ALL' && book.field === currentFieldFilter;
                            return `
                                <article class="p-5 rounded-2xl border transition-all ${
                                    isHighlighted 
                                    ? 'bg-amber-50/40 dark:bg-amber-950/20 border-archive-gold dark:border-amber-500 ring-1 ring-archive-gold/30' 
                                    : 'bg-white dark:bg-slate-800/40 border-archive-border dark:border-slate-700/80 hover:border-archive-gold/60'
                                } shadow-xs">
                                    <div class="flex flex-wrap items-start justify-between gap-2 mb-3">
                                        <div>
                                            <div class="flex items-center gap-2 flex-wrap">
                                                <span class="text-xs font-bold text-archive-gold dark:text-amber-400">#${idx + 1}</span>
                                                <h4 class="serif-title text-base sm:text-lg font-bold text-archive-ink dark:text-white">
                                                    《${book.title}》
                                                </h4>
                                                ${book.pubYear ? `<span class="text-xs text-archive-muted dark:text-slate-400 font-medium">(${book.pubYear})</span>` : ''}
                                            </div>
                                        </div>
                                        <span class="px-2.5 py-1 rounded-lg text-xs font-semibold border ${getFieldBadgeStyle(book.field)}">
                                            ${book.field}
                                        </span>
                                    </div>

                                    <!-- 저자 정보 바 -->
                                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1.5 px-3.5 py-2.5 rounded-xl bg-stone-50 dark:bg-slate-900/70 border border-stone-200/70 dark:border-slate-700/60 mb-3.5 text-xs sm:text-sm">
                                        <div class="flex items-center gap-1.5 font-bold text-archive-navy dark:text-slate-100">
                                            <i data-lucide="user-check" class="w-4 h-4 text-archive-gold dark:text-amber-400"></i>
                                            <span>저자: ${book.author}</span>
                                        </div>
                                        <div class="flex items-center gap-1.5 text-archive-muted dark:text-slate-400">
                                            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                                            <span>생몰연도: <strong class="font-semibold text-archive-ink dark:text-slate-300">${book.birth} ~ ${book.death}</strong></span>
                                        </div>
                                    </div>

                                    <!-- 사건과의 연관성 및 핵심 내용 -->
                                    <div class="text-sm text-archive-ink/90 dark:text-slate-300 leading-relaxed">
                                        <span class="inline-block font-semibold text-archive-navy dark:text-amber-300 mr-1">
                                            [사건과의 연계 및 주요 내용]
                                        </span>
                                        ${book.summary}
                                    </div>
                                </article>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            desktopContainer.innerHTML = html;
            mobileContainer.innerHTML = html;
        }

        // 뷰 2: 고전/저자 도서관 역방향 탐색 그리드 렌더링
        function renderBooksLibrary(filteredEvents) {
            const container = document.getElementById('books-grid-container');
            const q = searchQuery.trim().toLowerCase();

            // 필터된 사건들로부터 모든 책 추출 (분야 필터와 검색어 정밀 반영)
            const allBooks = [];
            filteredEvents.forEach(ev => {
                ev.books.forEach(book => {
                    if (currentFieldFilter !== 'ALL' && book.field !== currentFieldFilter) return;
                    if (q) {
                        const matchBook = book.title.toLowerCase().includes(q) ||
                                          book.author.toLowerCase().includes(q) ||
                                          book.summary.toLowerCase().includes(q) ||
                                          ev.title.toLowerCase().includes(q) ||
                                          ev.year.toLowerCase().includes(q);
                        if (!matchBook) return;
                    }
                    allBooks.push({
                        ...book,
                        eventId: ev.id,
                        eventTitle: ev.title,
                        eventYear: ev.year,
                        eventEra: ev.era
                    });
                });
            });

            document.getElementById('filtered-book-status').textContent = allBooks.length;

            if (allBooks.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white dark:bg-slate-900 rounded-2xl border border-archive-border dark:border-slate-800">
                        <i data-lucide="book-x" class="w-12 h-12 text-stone-300 dark:text-slate-600 mx-auto mb-3"></i>
                        <p class="text-sm font-semibold text-archive-muted dark:text-slate-400">조건에 맞는 고전이나 저자가 없습니다.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allBooks.map(item => `
                <div onclick="jumpToEventFromBook('${item.eventId}')" 
                    class="group bg-white dark:bg-slate-900 rounded-2xl p-5 border border-archive-border dark:border-slate-800 hover:border-archive-gold dark:hover:border-amber-500 shadow-xs hover:shadow-md transition-all cursor-pointer flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2.5">
                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-semibold border ${getFieldBadgeStyle(item.field)}">
                                ${item.field}
                            </span>
                            <span class="text-xs text-archive-muted dark:text-slate-400 font-medium">
                                ${item.pubYear || item.eventEra}
                            </span>
                        </div>

                        <h3 class="serif-title text-lg font-bold text-archive-navy dark:text-white group-hover:text-archive-gold dark:group-hover:text-amber-400 transition-colors mb-1">
                            《${item.title}》
                        </h3>

                        <p class="text-xs font-semibold text-archive-ink dark:text-slate-300 mb-3">
                            ${item.author} <span class="font-normal text-archive-muted dark:text-slate-400">(${item.birth} ~ ${item.death})</span>
                        </p>

                        <p class="text-xs sm:text-sm text-archive-muted dark:text-slate-400 line-clamp-3 leading-relaxed mb-4">
                            ${item.summary}
                        </p>
                    </div>

                    <!-- 연결된 역사적 사건 푸터 -->
                    <div class="pt-3 border-t border-stone-100 dark:border-slate-800 flex items-center justify-between gap-2 text-xs">
                        <div class="flex items-center gap-1.5 text-archive-gold dark:text-amber-400 font-semibold truncate">
                            <i data-lucide="landmark" class="w-3.5 h-3.5 shrink-0"></i>
                            <span class="truncate">${item.eventYear} · ${item.eventTitle}</span>
                        </div>
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-stone-400 group-hover:text-archive-gold shrink-0"></i>
                    </div>
                </div>
            `).join('');
        }

        // 도서관 뷰에서 책 클릭 시 해당 사건 뷰로 점프
        function jumpToEventFromBook(eventId) {
            selectedEventId = eventId;
            switchView('events');
            if (window.innerWidth < 1024) {
                document.getElementById('mobile-detail-modal').classList.remove('hidden');
            }
        }

        // ============================================================================
        // 사용자 정의 사건/저서 추가 모달 제어
        // ============================================================================
        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('add-entry-form').reset();
        }

        function handleAddSubmit(e) {
            e.preventDefault();
            const era = document.getElementById('new-era').value;
            const year = document.getElementById('new-year').value.trim();
            const title = document.getElementById('new-event-title').value.trim();
            const significance = document.getElementById('new-event-desc').value.trim();

            const bookTitle = document.getElementById('new-book-title').value.trim();
            const bookField = document.getElementById('new-book-field').value;
            const authorName = document.getElementById('new-author-name').value.trim();
            const authorBirth = document.getElementById('new-author-birth').value.trim();
            const authorDeath = document.getElementById('new-author-death').value.trim();
            const bookSummary = document.getElementById('new-book-summary').value.trim();

            const newBookObj = {
                title: bookTitle,
                pubYear: "",
                author: authorName,
                birth: authorBirth,
                death: authorDeath,
                field: bookField,
                summary: bookSummary
            };

            // 동일한 이름의 사건이 이미 있으면 해당 사건에 책만 추가
            const existingEvent = archiveData.find(ev => ev.title === title);
            if (existingEvent) {
                existingEvent.books.push(newBookObj);
                selectedEventId = existingEvent.id;
            } else {
                const newId = 'evt-custom-' + Date.now();
                archiveData.unshift({
                    id: newId,
                    year,
                    era,
                    title,
                    significance,
                    books: [newBookObj]
                });
                selectedEventId = newId;
            }

            saveToStorage();
            closeAddModal();
            switchView('events');
            showToast(`'${title}' 및 《${bookTitle}》 항목이 아카이브에 등록되었습니다.`);
        }

        function showToast(msg) {
            const box = document.getElementById('toast-box');
            document.getElementById('toast-message').textContent = msg;
            box.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                box.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => box.classList.add('hidden'), 300);
            }, 3200);
        }

        // 페이지 로드 시 실행
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
