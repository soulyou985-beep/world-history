<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World History Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF8F5;--card:#fff;--ink:#1E242B;--muted:#6B7480;--gold:#A8762F;--gold-soft:#F4ECE1;--line:#E7E0D5;--navy:#1B2A4A}
html.dark{--paper:#12161C;--card:#1A2028;--ink:#E6E8EB;--muted:#9AA3AE;--gold:#D9A55A;--gold-soft:#2A2418;--line:#2B333D;--navy:#E6E8EB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 40px) 20px 20px;display:flex;flex-direction:column;justify-content:center}
.brand{text-align:center;margin-bottom:28px}
.brand small{display:block;letter-spacing:.28em;font-size:11px;color:var(--gold);font-weight:700}
.brand h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;font-weight:600;margin:6px 0 0;line-height:1.1}
.card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin:0 0 14px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.98)}
.card:hover{border-color:var(--gold)}
.ic{flex:none;width:58px;height:58px;border-radius:16px;background:var(--gold-soft);display:grid;place-items:center;font-size:28px}
.tx{flex:1;min-width:0}
.en{font-family:"Cormorant Garamond",Georgia,serif;font-size:23px;font-weight:600;line-height:1.15}
.ko{font-size:13.5px;color:var(--muted);margin-top:3px}
footer{text-align:center;padding:24px 0 calc(env(safe-area-inset-bottom) + 24px);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:16px;color:var(--muted);letter-spacing:.04em}
</style>
<script>try{const d=JSON.parse(localStorage.getItem('wh_dark'));if(d===null?matchMedia('(prefers-color-scheme: dark)').matches:d)document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<main>
  <div class="brand"><small>WORLD HISTORY LIBRARY</small><h1>History &amp; Great Books</h1></div>
  <a class="card" href="events.html"><div class="ic">🏛</div><div class="tx"><div class="en">World History Events</div><div class="ko">세계사 주요사건</div></div></a>
  <a class="card" href="reader.html"><div class="ic">📜</div><div class="tx"><div class="en">Great Books of World History</div><div class="ko">세계사 주요도서</div></div></a>
  <a class="card" href="mustread.html"><div class="ic">📖</div><div class="tx"><div class="en">Must-Read Books for Life</div><div class="ko">인생 필독서</div></div></a>
</main>
<footer>Designed by cK</footer>
</body>
</html>
