<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World History Events — 세계사 주요사건 200</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FAF8F5;--card:#fff;--ink:#1E242B;--muted:#6B7480;--gold:#A8762F;--gold-soft:#F4ECE1;--line:#E7E0D5;--navy:#1B2A4A;--ok:#2F9D6B}
html.dark{--paper:#12161C;--card:#1A2028;--ink:#E6E8EB;--muted:#9AA3AE;--gold:#D9A55A;--gold-soft:#2A2418;--line:#2B333D;--navy:#E6E8EB}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;word-break:keep-all}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.bar{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
.bar h1{font-family:"Noto Serif KR",serif;font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-width:40px;height:40px;font-size:15px;padding:0 10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 40px)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero b{font-family:"Noto Serif KR",serif;font-size:17px}
.hero p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.stat{font-size:13px;color:var(--muted);margin:8px 2px}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 6px}
.progress>i{display:block;height:100%;background:var(--gold)}
.era{margin:26px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--gold-soft)}
.era h2{font-family:"Noto Serif KR",serif;font-size:19px;margin:0}
.era small{color:var(--muted);font-size:12px}
.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.evt{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:8px 0;text-decoration:none;color:inherit}
.evt:before{content:"";position:absolute;left:-17px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--gold)}
.evt.has:before{background:var(--gold)}
.evt.done{opacity:.6}
.evt .y{font-size:12px;color:var(--gold);font-weight:700;display:flex;gap:6px;align-items:center}
.evt .n{color:var(--muted);font-weight:500}
.evt .t{font-weight:700;font-size:16px;line-height:1.4;margin-top:1px}
.evt .bk{font-size:12.5px;color:var(--muted);margin-top:4px}
.evt .bk b{color:var(--ink);font-weight:500}
.tag{font-size:11px;border-radius:999px;padding:1px 7px;background:var(--gold-soft);color:var(--gold);font-weight:500}
.tag.g{background:var(--line);color:var(--muted)}
.tag.ok{background:#2F7D5B22;color:var(--ok)}
/* 상세 */
.dmeta{font-size:13px;color:var(--gold);font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dtitle{font-family:"Noto Serif KR",serif;font-size:24px;line-height:1.35;margin:8px 0 12px}
.sig{font-size:17px;line-height:1.85;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 16px;margin:0}
h3.sec{font-size:15px;margin:26px 0 8px;color:var(--muted);font-weight:700}
.book{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;text-decoration:none;color:inherit}
.book .row{display:flex;gap:12px;align-items:center}
.num{flex:none;width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px}
.book .t{font-weight:700;font-size:16px;line-height:1.35}
.book .a{font-size:13px;color:var(--muted)}
.book .s{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.65}
.book .go{margin-left:auto;flex:none;font-size:12px;color:var(--gold);font-weight:700}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);font-size:14px}
.ctx{display:grid;gap:6px;margin-top:6px}
.ctx a{font-size:14px;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.ctx a b{color:var(--ink);font-weight:500}
.done-btn{width:100%;margin-top:22px;font:inherit;padding:12px;border-radius:12px;border:0;background:var(--navy);color:var(--paper);font-weight:700;cursor:pointer}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;font:inherit;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;line-height:1.4}
.nav button:last-child{text-align:right}
.nav button:disabled{opacity:.35}
</style>
</head>

: "근세", "year": "1588년", "region": "유럽", "title": "스페인 무적함대의 패배", "sig": "엘리자베스 1세의 잉글랜드가 스페인을 막아 내며 해양 강국으로 떠오를 발판을 마련했습니다.", "books": []}, {"id": "097", "era": "근세", "year": "1592 ~ 1598년", "region": "동아시아", "title": "임진왜란", "sig": "조선·명·일본이 얽힌 동아시아 국제전으로, 세 나라 모두 정치·사회적 대변동을 겪었습니다.", "books": []}, {"id": "098", "era": "근세", "year": "1600 ~ 1602년", "region": "세계", "title": "영국·네덜란드 동인도회사 설립", "sig": "주식을 발행해 위험을 나누는 근대 주식회사가 등장해 아시아 무역과 식민지 경영에 나섰습니다.", "books": []}, {"id": "099", "era": "근세", "year": "1603년", "region": "동아시아", "title": "에도 막부 성립", "sig": "도쿠가와 이에야스가 세운 막부 아래 일본은 260년간 평화와 통제된 쇄국의 시대를 보냈습니다.", "books": []}, {"id": "100", "era": "근세", "year": "1618 ~ 1648년", "region": "유럽", "title": "30년 전쟁과 베스트팔렌 조약", "sig": "종교전쟁이 국가 간 패권전쟁으로 번진 끝에, 주권국가들이 공존하는 근대 국제질서가 탄생했습니다.", "books": [{"id": "057", "title": "전쟁과 평화의 법", "author": "휴고 그로티우스", "pubYear": "1625년", "short": "30년 전쟁의 참상을 목격하며 신의 뜻이 아닌 인간의 보편적 이성(자연법)에 근거해 국가 간 전쟁 규칙과 평화 질서를 규정한 근대 국제법의 원전입니다."}]}, {"id": "101", "era": "근세", "year": "1620년", "region": "아메리카", "title": "메이플라워호와 북미 식민지", "sig": "신앙의 자유를 찾은 청교도들이 북미에 정착하며 자치 공동체의 전통을 남겼습니다.", "books": []}, {"id": "102", "era": "근세", "year": "1633년", "region": "유럽", "title": "갈릴레이 종교재판", "sig": "지동설을 옹호한 갈릴레이가 유죄 판결을 받았고, 이 소식에 데카르트는 자신의 책 출간을 미루었습니다.", "books": [{"id": "056", "title": "두 우주 체계에 관한 대화", "author": "갈릴레오 갈릴레이", "pubYear": "1632년", "short": "망원경으로 목성의 위성과 금성의 위상을 관측한 증거를 토대로 지동설을 옹호하여 종교재판에 회부되었으나 근대 실험물리학의 승리를 이끌었습니다."}, {"id": "058", "title": "방법서설", "author": "르네 데카르트", "pubYear": "1637년", "short": "30년 전쟁의 진중에서 사색을 시작한 데카르트가 모든 불확실한 권위를 의심한 끝에 '나는 생각한다, 고로 존재한다'는 근대 합리론의 주춧돌을 세웠습니다."}]}, {"id": "103", "era": "혁명의 시대", "year": "1642 ~ 1649년", "region": "유럽", "title": "영국 내전과 찰스 1세 처형", "sig": "의회와 국왕이 맞선 내전 끝에 왕이 공개 처형되었고, 국가 권력의 근거를 묻는 정치철학이 탄생했습니다.", "books": [{"id": "059", "title": "리바이어던", "author": "토머스 홉스", "pubYear": "1651년", "short": "잉글랜드 내전의 무질서와 공포를 겪은 홉스가 '만인의 만인에 대한 투쟁' 상태를 끝내기 위해 시민들이 계약을 맺어 강력한 주권국가(리바이어던)를 세운다고 논증했습니다."}, {"id": "060", "title": "아레오파지티카", "author": "존 밀턴", "pubYear": "1644년", "short": "청교도 혁명기 의회의 출판 사전검열법에 맞서 언론과 출판의 자유가 진리 발견의 필수 조건임을 역설한 표현의 자유 고전입니다."}]}, {"id": "104", "era": "혁명의 시대", "year": "1644년", "region": "동아시아", "title": "명 멸망과 청의 중국 지배", "sig": "만주족의 청이 베이징에 입성해 중국 역사상 가장 넓은 영토를 다스린 마지막 왕조가 되었습니다.", "books": []}, {"id": "105", "era": "혁명의 시대", "year": "1661년", "region": "유럽", "title": "루이 14세의 친정과 절대왕정", "sig": "'짐이 곧 국가'라는 말로 상징되는 절대왕정이 베르사유 궁전에서 절정을 이루었습니다.", "books": []}, {"id": "106", "era": "혁명의 시대", "year": "1682 ~ 1725년", "region": "유럽", "title": "표트르 대제의 러시아 근대화", "sig": "서유럽식 개혁을 밀어붙이고 상트페테르부르크를 세워 러시아를 유럽 강국으로 끌어올렸습니다.", "books": []}, {"id": "107", "era": "혁명의 시대", "year": "1687년", "region": "유럽", "title": "뉴턴의 『프린키피아』와 과학혁명의 완성", "sig": "만유인력과 운동 법칙으로 하늘과 땅을 같은 수학 법칙으로 설명하며 근대 과학이 완성되었습니다.", "books": [{"id": "061", "title": "자연철학의 수학적 원리 (프린키피아)", "author": "아이작 뉴턴", "pubYear": "1687년", "short": "운동의 3법칙과 만유인력의 법칙을 통해 지상과 천상의 운동을 하나의 수학적 체계로 통합함으로써 인류 이성에 대한 무한한 신뢰와 계몽사상을 촉발했습니다."}]}, {"id": "108", "era": "혁명의 시대", "year": "1688 ~ 1689년", "region": "유럽", "title": "명예혁명과 권리장전", "sig": "피를 흘리지 않고 왕을 교체하고 의회 우위를 법으로 못 박아 입헌군주제의 길을 열었습니다.", "books": [{"id": "062", "title": "통치론 & 인간지성론", "author": "존 로크", "pubYear": "1689년", "short": "명예혁명의 정당성을 이론화하여 국민 주권과 삼권분립의 기초를 닦았으며, 인간의 마음은 백지(타불라 라사)라는 경험론 철학을 확립했습니다."}]}, {"id": "109", "era": "혁명의 시대", "year": "18세기", "region": "세계", "title": "대서양 삼각무역과 노예무역의 절정", "sig": "1,200만 명 이상의 아프리카인이 아메리카로 끌려가 플랜테이션 노동에 동원되었습니다.", "books": []}, {"id": "110", "era": "혁명의 시대", "year": "1751 ~ 1772년", "region": "유럽", "title": "계몽주의와 『백과전서』", "sig": "이성으로 미신과 권위에 맞선 계몽사상가들이 지식을 집대성하며 혁명의 사상적 토대를 놓았습니다.", "books": [{"id": "063", "title": "백과전서 (Encyclopédie)", "author": "드니 디드로 & 달랑베르", "pubYear": "1751~1772년", "short": "볼테르, 루소, 몽테스키외 등 당대 최고 지성들이 참여해 과학·기술·철학 지식을 체계화함으로써 교회와 왕정의 지적 독점을 무너뜨린 계몽주의의 기념비입니다."}, {"id": "064", "title": "사회계약론", "author": "장자크 루소", "pubYear": "1762년", "short": "'인간은 자유롭게 태어났으나 도처에서 쇠사슬에 묶여 있다'는 선언과 함께, 주권은 오직 국민의 일반의지에 있다는 근대 민주주의의 핵심 원리를 제시했습니다."}, {"id": "065", "title": "관용론", "author": "볼테르", "pubYear": "1763년", "short": "종교적 광신과 사법 살인(칼라스 사건)에 맞서 사상과 신앙의 자유, 인간 이성에 기반한 관용의 정신을 호소한 계몽주의 대표 저서입니다."}]}, {"id": "111", "era": "혁명의 시대", "year": "1756 ~ 1763년", "region": "세계", "title": "7년 전쟁", "sig": "유럽·북미·인도에서 동시에 벌어진 '최초의 세계대전'으로, 영국이 해외 패권을 차지했습니다.", "books": []}, {"id": "112", "era": "혁명의 시대", "year": "1757년", "region": "남아시아", "title": "플라시 전투", "sig": "영국 동인도회사가 벵골 태수를 꺾어 영국의 인도 지배가 시작되었습니다.", "books": []}, {"id": "113", "era": "혁명의 시대", "year": "1760년대 ~", "region": "유럽", "title": "영국 산업혁명", "sig": "증기기관과 공장제 기계공업이 등장하며 인류의 생산력과 삶의 방식이 근본적으로 바뀌었습니다.", "books": [{"id": "066", "title": "국부론", "author": "애덤 스미스", "pubYear": "1776년", "short": "산업혁명 초기 분업의 생산성 혁신을 포착하여, 국가의 중상주의적 간섭 대신 시장의 '보이지 않는 손'과 자유방임이 국부를 증진시킨다는 고전파 경제학을 창시했습니다."}, {"id": "067", "title": "인구론", "author": "토머스 맬서스", "pubYear": "1798년", "short": "산업화 속 급증하는 인구는 기하급수적으로 늘지만 식량은 산술급수적으로 증가하므로 빈곤과 기근이 필연적이라고 분석해 다윈의 진화론에도 영감을 주었습니다."}]}, {"id": "114", "era": "혁명의 시대", "year": "1776년", "region": "아메리카", "title": "미국 독립선언", "sig": "'모든 인간은 평등하게 창조되었다'고 선언한 13개 식민지가 영국에서 독립했습니다.", "books": [{"id": "069", "title": "상식 (Common Sense)", "author": "토머스 페인", "pubYear": "1776년", "short": "영국 국왕의 세습 통치의 부당함을 명쾌한 언어로 비판하고 아메리카 대륙의 완전 독립과 공화국 수립을 촉구하여 독립혁명의 불길을 지핀 소책자입니다."}]}, {"id": "115", "era": "혁명의 시대", "year": "1787년", "region": "아메리카", "title": "미국 헌법 제정", "sig": "삼권분립과 연방제를 갖춘 성문 헌법으로, 현존하는 가장 오래된 근대 헌법입니다.", "books": [{"id": "070", "title": "페더럴리스트 페이퍼 (연방주의자 논집)", "author": "알렉산더 해밀턴, 제임스 매디슨, 존 제이", "pubYear": "1788년", "short": "미합중국 헌법 비준을 위해 집필된 85편의 논설로, 거대 공화국에서 다수의 횡포를 막고 권력 분립과 견제·균형을 실현하는 헌법 이론의 정수를 담았습니다."}, {"id": "071", "title": "미국의 민주주의", "author": "알렉시 드 토크빌", "pubYear": "1835년", "short": "독립 반세기 후의 미국 사회를 관찰하며 평등의 확산이 가져온 민주주의의 활력과 함께 '다수의 전제'라는 잠재적 위험성을 통찰한 정치사회학의 고전입니다."}]}, {"id": "116", "era": "혁명의 시대", "year": "1789년", "region": "유럽", "title": "프랑스 대혁명과 인권선언", 008년 금융위기 이후 심화된 불평등의 원인을 방대한 역사 데이터로 추적하여 '자본수익률(r)이 경제성장률(g)보다 크다(r > g)'는 공식을 통해 부의 세습 구조를 입증했습니다."}]}, {"id": "195", "era": "21세기", "year": "2010 ~ 2011년", "region": "서아시아", "title": "아랍의 봄", "sig": "SNS로 조직된 시위가 중동·북아프리카 독재 정권을 무너뜨렸지만 상당수가 내전과 혼란으로 이어졌습니다.", "books": []}, {"id": "196", "era": "21세기", "year": "2013년", "region": "세계", "title": "스노든 폭로와 감시 사회", "sig": "미국 정보기관의 대규모 감시가 폭로되어 디지털 시대의 사생활과 권력 문제가 세계적 쟁점이 되었습니다.", "books": [{"id": "133", "title": "감시자본주의 시대", "author": "쇼샤나 주보프", "pubYear": "2019년", "short": "거대 빅테크 기업들이 인간의 온라인 행동 데이터를 무료 원재료로 추출해 예측·조작하는 새로운 자본주의 형태를 날카롭게 비판한 디지털 시대의 필독서입니다."}]}, {"id": "197", "era": "21세기", "year": "2015년", "region": "세계", "title": "파리 기후협정", "sig": "거의 모든 나라가 지구 온도 상승을 1.5~2℃ 이내로 억제하자는 데 합의했습니다.", "books": []}, {"id": "198", "era": "21세기", "year": "2016년", "region": "세계", "title": "브렉시트·트럼프 당선과 포퓰리즘의 부상", "sig": "세계화에 대한 반발이 영국의 EU 탈퇴와 미국 대선 결과로 표출되었습니다.", "books": []}, {"id": "199", "era": "21세기", "year": "2020 ~ 2022년", "region": "세계", "title": "코로나19 팬데믹", "sig": "전 세계가 봉쇄를 겪으며 공중보건·세계화·원격 사회의 의미를 다시 묻게 되었습니다.", "books": []}, {"id": "200", "era": "21세기", "year": "2022년", "region": "세계", "title": "러시아의 우크라이나 침공과 생성형 AI의 등장", "sig": "유럽에서 대규모 전쟁이 재발했고, 같은 해 ChatGPT가 공개되어 AI가 일상으로 들어왔습니다.", "books": [{"id": "134", "title": "호모 데우스 & 넥서스", "author": "유발 하라리", "pubYear": "2015~2024년", "short": "생명공학과 인공지능(AI)이 결합하여 인간이 신의 영역에 도전하는 미래와, 비인간 지능 네트워크가 인류 민주주의에 던지는 실존적 질문을 탐구합니다."}]}]};</script>
<script>
const D=window.__DATA, EV=D.events;
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let era=S.get('ev_era','전체'),q='',onlyBooks=false,done=new Set(S.get('ev_done',[])),listScroll=0;
const readBooks=new Set(S.get('wh_read',[]));
function applyTheme(d){document.documentElement.classList.toggle('dark',d)}
applyTheme(S.get('wh_dark',matchMedia('(prefers-color-scheme: dark)').matches));
$('theme').onclick=()=>{const d=!document.documentElement.classList.contains('dark');applyTheme(d);S.set('wh_dark',d)};
$('back').onclick=()=>{location.hash=''};
const totalBooks=EV.reduce((n,e)=>n+e.books.length,0);

function renderList(){
  $('back').hidden=true;$('htitle').textContent='세계사 주요사건 200';
  const k=q.trim().toLowerCase();
  const list=EV.filter(e=>(era==='전체'||e.era===era)&&(!onlyBooks||e.books.length)&&
    (!k||(e.title+e.year+e.region+e.sig+e.books.map(b=>b.title+b.author).join('')).toLowerCase().includes(k)));
  let h=`<div class="hero"><b>사건이 뼈대, 명저는 살</b><p>세계사 주요사건 200개를 시대순으로 따라가며, 그 사건이 낳거나 비춰 주는 명저 요약으로 이어집니다.</p></div>
  <input class="search" id="q" placeholder="사건, 연도, 지역, 책 검색" value="${esc(q)}">
  <div class="chips">${['전체',...D.eras.map(x=>x.name)].map(x=>`<button class="chip ${x===era?'on':''}" data-era="${esc(x)}">${esc(x)}</button>`).join('')}
  <button class="chip ${onlyBooks?'on':''}" id="ob">📚 명저 연결 사건만</button></div>
  <div class="stat">사건 ${EV.length}개 · 연결 명저 ${totalBooks}권 · 공부함 ${done.size} / ${EV.length}</div>
  <div class="progress"><i style="width:${done.size/EV.length*100}%"></i></div>`;
  for(const E of D.eras){
    const items=list.filter(e=>e.era===E.name);if(!items.length)continue;
    h+=`<div class="era"><h2>${esc(E.name)}</h2><small>${esc(E.range)} · ${EV.filter(e=>e.era===E.name).length}개 사건</small></div><div class="tl">`;
    for(const e of items){
      h+=`<a class="evt ${e.books.length?'has':''} ${done.has(e.id)?'done':''}" href="#evt-${e.id}">
        <div class="y"><span class="n">${+e.id}</span>${esc(e.year)} <span class="tag g">${esc(e.region)}</span>${done.has(e.id)?'<span class="tag ok">✓</span>':''}</div>
        <div class="t">${esc(e.title)}</div>
        ${e.books.length?`<div class="bk">📚 ${e.books.map(b=>`<b>${esc(b.title)}</b>`).join(' · ')}</div>`:''}</a>`;
    }
    h+='</div>';
  }
  if(!list.length)h+='<p class="stat">검색 결과가 없습니다.</p>';
  app.innerHTML=h;
  const qi=$('q');qi.oninput=e=>{q=e.target.value;const p=qi.selectionStart;renderList();const n=$('q');n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll('[data-era]').forEach(c=>c.onclick=()=>{era=c.dataset.era;S.set('ev_era',era);renderList()});
  $('ob').onclick=()=>{onlyBooks=!onlyBooks;renderList()};
  window.scrollTo(0,listScroll);
}

function renderEvent(id){
  const i=EV.findIndex(e=>e.id===id);if(i<0){location.hash='';return}
  const e=EV[i],prev=EV[i-1],next=EV[i+1];
  $('back').hidden=false;$('htitle').textContent=`사건 ${+e.id} / ${EV.length}`;
  // 같은 시대에서 앞뒤로 책이 연결된 가장 가까운 사건 (맥락 잇기)
  const near=[];for(let j=i-1;j>=0&&near.length<1;j--)if(EV[j].books.length&&!e.books.length)near.push(EV[j]);
  for(let j=i+1;j<EV.length&&near.length<2;j++)if(EV[j].books.length&&!e.books.length)near.push(EV[j]);
  let h=`<div class="dmeta"><span>${esc(e.era)}</span>·<span>${esc(e.year)}</span><span class="tag g">${esc(e.region)}</span></div>
  <h2 class="dtitle">${esc(e.title)}</h2>
  <p class="sig">${esc(e.sig)}</p>
  <h3 class="sec">📚 이 사건과 연결된 명저 (${e.books.length})</h3>`;
  if(e.books.length){
    for(const b of e.books)h+=`<a class="book" href="reader.html#book-${b.id}"><div class="row"><div class="num">${+b.id}</div><div><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)} · ${esc(b.pubYear)}</div></div><span class="go">${readBooks.has(b.id)?'읽음 ✓':'요약 읽기 ›'}</span></div><p class="s">${esc(b.short)}</p></a>`;
  }else{
    h+=`<div class="empty">아직 연결된 명저가 없습니다. 이 사건을 다룬 책은 '인생 필독서' 신규 요약(136번~)이 추가될 때 여기에 연결됩니다.</div>`;
    if(near.length)h+=`<div class="ctx">${near.map(n=>`<a href="#evt-${n.id}">가까운 사건의 명저 → <b>${esc(n.title)}</b> (${n.books.length}권)</a>`).join('')}</div>`;
  }
  h+=`<button class="done-btn" id="dn">${done.has(e.id)?'✓ 공부함 (취소)':'이 사건 공부했어요'}</button>
  <div class="nav"><button id="pv" ${prev?'':'disabled'}>← ${prev?esc(prev.year)+'<br>'+esc(prev.title):''}</button><button id="nx" ${next?'':'disabled'}>${next?esc(next.year)+' →<br>'+esc(next.title):''}</button></div>`;
  app.innerHTML=h;
  $('dn').onclick=()=>{done.has(e.id)?done.delete(e.id):done.add(e.id);S.set('ev_done',[...done]);renderEvent(id)};
  if(prev)$('pv').onclick=()=>location.hash='evt-'+prev.id;
  if(next)$('nx').onclick=()=>location.hash='evt-'+next.id;
  window.scrollTo(0,0);
}

function route(){
  const m=location.hash.match(/^#evt-(\d{3})$/);
  if(m){if(document.querySelector('.search'))listScroll=window.scrollY;renderEvent(m[1])}
  else renderList();
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
