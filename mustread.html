<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Must-Read Books for Life — 인생 필독서 200</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F5;--card:#fff;--ink:#1E242B;--muted:#6B7480;--gold:#A8762F;--gold-soft:#F4ECE1;--line:#E7E0D5;--navy:#1B2A4A;
  --fs:17px;
}
html.dark{--paper:#12161C;--card:#1A2028;--ink:#E6E8EB;--muted:#9AA3AE;--gold:#D9A55A;--gold-soft:#2A2418;--line:#2B333D;--navy:#E6E8EB}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.bar{display:flex;align-items:center;gap:8px;max-width:760px;margin:0 auto}
.bar h1{font-family:"Noto Serif KR",serif;font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-width:40px;height:40px;font-size:15px;padding:0 10px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 40px)}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.stat{font-size:13px;color:var(--muted);margin:8px 2px}
.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 14px}
.progress>i{display:block;height:100%;background:var(--gold)}
.ev{margin:22px 0 8px}
.ev small{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.02em}
.ev h2{font-family:"Noto Serif KR",serif;font-size:16px;margin:2px 0 0}
.book{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;text-decoration:none;color:inherit}
.num{flex:none;width:38px;height:38px;border-radius:10px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px}
.book .t{font-weight:700;font-size:16px;line-height:1.35}
.book .a{font-size:13px;color:var(--muted)}
.badge{flex:none;margin-left:auto;font-size:11px;border-radius:999px;padding:3px 8px;white-space:nowrap}
.badge.ok{background:var(--gold-soft);color:var(--gold)}
.badge.wait{background:var(--line);color:var(--muted)}
.badge.read{background:#2F7D5B22;color:#2F9D6B}
/* reader */
.meta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:14px}
.meta .ev2{color:var(--gold);font-weight:700;font-size:12px;text-decoration:none;display:block}.ev h2 a{color:inherit;text-decoration:none}.ev h2 a:after{content:' ›';color:var(--gold)}
.meta .row{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);margin-top:6px}
article{font-size:var(--fs);line-height:1.85;word-break:keep-all;overflow-wrap:break-word}
article h1{font-family:"Noto Serif KR",serif;font-size:1.55em;line-height:1.35;margin:.2em 0 .6em}
article h2{font-family:"Noto Serif KR",serif;font-size:1.2em;margin:1.8em 0 .5em;padding-bottom:.3em;border-bottom:2px solid var(--gold-soft)}
article h3{font-size:1.05em;margin:1.4em 0 .4em;color:var(--gold)}
article p{margin:.7em 0}
article blockquote{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--gold);background:var(--gold-soft);border-radius:0 10px 10px 0}
article blockquote p{margin:.2em 0}
article hr{border:0;border-top:1px dashed var(--line);margin:1.6em 0}
article ul,article ol{padding-left:1.3em}
article li{margin:.3em 0}
.tbl{overflow-x:auto;margin:1em 0}
article table{border-collapse:collapse;font-size:.88em;min-width:100%}
article th,article td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
article th{background:var(--gold-soft)}
.pending{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:28px}
.nav button{flex:1;font:inherit;font-size:14px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.nav button:last-child{text-align:right}
.nav button:disabled{opacity:.35}
.markread{width:100%;margin-top:18px;font:inherit;padding:12px;border-radius:12px;border:0;background:var(--navy);color:var(--paper);font-weight:700;cursor:pointer}
.fsbox{display:flex;gap:6px}
#readbar{position:fixed;left:0;top:0;height:3px;background:var(--gold);z-index:20;width:0}
</style>
</head>

<script>
const M=window.__MUST;
const S={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const app=document.getElementById('app'),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function applyTheme(d){document.documentElement.classList.toggle('dark',d)}
applyTheme(S.get('wh_dark',matchMedia('(prefers-color-scheme: dark)').matches));
$('theme').onclick=()=>{const d=!document.documentElement.classList.contains('dark');applyTheme(d);S.set('wh_dark',d)};
$('back').onclick=()=>{location.hash=''};
let cat='전체',q='',listScroll=0;
const readGreat=new Set(S.get('wh_read',[])),readMust=new Set(S.get('mr_read',[]));
const isRead=m=>m.ref?readGreat.has(m.ref):readMust.has(m.no);
const href=m=>m.ref?`reader.html#book-${m.ref}`:`#must-${m.no}`;

function renderList(){
  $('back').hidden=true;$('htitle').textContent='인생 필독서 200';
  const cats=['전체',...new Set(M.map(m=>m.cat))];
  const k=q.trim().toLowerCase();
  const list=M.filter(m=>(cat==='전체'||m.cat===cat)&&(!k||(m.title+m.author+m.cat).toLowerCase().includes(k)));
  const readN=M.filter(isRead).length;
  let h=`<input class="search" id="q" placeholder="책, 저자 검색" value="${esc(q)}">
  <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  <div class="stat">${M.length}권 · 읽음 ${readN}권</div>
  <div class="progress"><i style="width:${readN/M.length*100}%"></i></div>`;
  let last='';
  for(const m of list){
    if(m.cat!==last){last=m.cat;h+=`<div class="ev"><small>${m.sec} · ${M.filter(x=>x.cat===m.cat).length}권</small><h2>${esc(m.cat)}</h2></div>`}
    h+=`<a class="book" href="${href(m)}"><div class="num">${m.no}</div><div><div class="t">${esc(m.title)}</div><div class="a">${esc(m.author)} · ${esc(m.year)}${m.ref?` · <span style="color:var(--gold)">세계사 주요도서 ›</span>`:''}</div></div>${isRead(m)?'<span class="badge read">읽음</span>':''}</a>`;
  }
  if(!list.length)h+='<p class="stat">검색 결과가 없습니다.</p>';
  app.innerHTML=h;
  const qi=$('q');qi.oninput=e=>{q=e.target.value;const p=qi.selectionStart;renderList();const n=$('q');n.focus();n.setSelectionRange(p,p)};
  app.querySelectorAll('[data-cat]').forEach(c=>c.onclick=()=>{cat=c.dataset.cat;renderList()});
  window.scrollTo(0,listScroll);
}

function renderBook(no){
  const i=M.findIndex(m=>m.no===no);if(i<0){location.hash='';return}
  const m=M[i];if(m.ref){location.href=href(m);return}
  $('back').hidden=false;$('htitle').textContent=m.title;
  let h=`<div class="meta"><div class="ev2">인생 필독서 ${m.no} · ${m.sec} ${esc(m.cat)}</div>
   <div class="row"><span>✍ ${esc(m.author)}</span><span>📅 ${esc(m.year)}</span></div></div>
   <article><h1>${esc(m.title)}</h1></article>
   <div class="pending"><b>요약 준비 중입니다.</b><br><br>세계사 주요도서 135권과 같은 방식으로 요약해 이어서 채워질 예정입니다.</div>
   <button class="markread" id="mr">${readMust.has(m.no)?'✓ 읽음 표시됨 (취소)':'다 읽었어요'}</button>`;
  const prev=M[i-1],next=M[i+1];
  h+=`<div class="nav"><button id="pv" ${prev?'':'disabled'}>← ${prev?esc(prev.title):''}</button><button id="nx" ${next?'':'disabled'}>${next?esc(next.title):''} →</button></div>`;
  app.innerHTML=h;
  $('mr').onclick=()=>{readMust.has(m.no)?readMust.delete(m.no):readMust.add(m.no);S.set('mr_read',[...readMust]);renderBook(no)};
  if(prev)$('pv').onclick=()=>location.href=href(prev);
  if(next)$('nx').onclick=()=>location.href=href(next);
  window.scrollTo(0,0);
}
function route(){
  const m=location.hash.match(/^#must-(\d+)$/);
  if(m){if(document.querySelector('.search'))listScroll=window.scrollY;renderBook(+m[1])}
  else renderList();
}
window.addEventListener('hashchange',route);
